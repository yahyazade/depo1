name: Build ZadeAI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'download/**'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build Fabric mod
        run: gradle --no-daemon build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ZadeAI-JAR
          path: build/libs/*jar
      - name: Publish direct JAR
        run: |
          mkdir -p download
          cp build/libs/zadeai-fabric-1.21.1-0.1.0.jar download/ZadeAI-1.21.1.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/ZadeAI-1.21.1.jar
          git diff --cached --quiet || (git commit -m "Publish compiled ZadeAI jar" && git push)
