plugins { id 'fabric-loom' version '1.9-SNAPSHOT' }
version = '0.2.0'
group = 'dev.zadeai'
base { archivesName = 'zadeai-fabric-1.21.1' }
repositories { mavenCentral(); maven { url 'https://maven.maxhenkel.de/repository/public' } }
dependencies {
 minecraft "com.mojang:minecraft:1.21.1"
 mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
 modImplementation "net.fabricmc:fabric-loader:0.16.14"
 modImplementation "net.fabricmc.fabric-api:fabric-api:0.115.6+1.21.1"
 implementation "de.maxhenkel.voicechat:voicechat-api:2.6.0"
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }